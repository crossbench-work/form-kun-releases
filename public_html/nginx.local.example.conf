# =============================================================================
# Local.app / nginx 向けの設定例（.htaccess が効かないとき）
#
# ドキュメントルートは必ずこのディレクトリ（public_html）にしてください。
# 「リポジトリ全体」をドキュメントルートにすると動きません。
#
# Local（Flywheel）などでは「カスタム設定」「サイト設定 → nginx」で追記するか、
# 環境によってはこのブロックをマージしてください。
#
# PHP-FPM のソケットパスは環境で異なります（php-fpm の設定・PHP バージョンを確認）。
# =============================================================================

server {
    listen 80;
    server_name form-kun.local;   # Local が割り当てたホスト名に合わせる
    root /absolute/path/to/form-kun/public_html;
    index index.php;

    charset utf-8;

    # 実ファイルがあればそのまま、なければ router.php（Apache の Rewrite と同等）
    location / {
        try_files $uri $uri/ /router.php?$is_args$args;
    }

    location ~ \.php$ {
        include fastcgi_params;
        fastcgi_param SCRIPT_FILENAME $document_root$fastcgi_script_name;
        # 例: Local / Homebrew（実際のパスに変更）
        fastcgi_pass unix:/var/run/php/php-fpm.sock;
        fastcgi_read_timeout 300;
    }

    location ~* ^/(app|sql)(/|$) {
        deny all;
    }
}
